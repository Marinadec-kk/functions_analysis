[project]
name = "functions-analysis"
version = "1.0.0"
description = "Government functions analysis pipeline"
requires-python = "==3.12.3"
readme = "README.md"
dependencies = [
    "pandas>=2.0.0",
    "python-docx>=1.1.0",
    "torch>=2.0.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.5",
    "six>=1.16.0",
    "sentence-transformers>=2.0.0",
    "tqdm>=4.65.0",
]


dependency-groups.dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.uv.sources]
numpy = { index = "pypi" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
