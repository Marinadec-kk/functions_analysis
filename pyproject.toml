[project]
name = "functions-analysis"
version = "1.0.0"
description = "Government functions analysis pipeline"
dependencies = [
    "pandas>=2.0.0",
    "python-docx>=1.1.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.5",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
