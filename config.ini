[API]
# Base URL for AI services. This can be overridden by AI_API_BASE_URL in .env
AI_API_BASE_URL = http://localhost:8000/api_from_ini

[Paths]
# Default input directory for documents. Overridden by environment variables.
DEFAULT_INPUT_DOCS_DIR = input_documents_from_ini

# Default output directory for results. Overridden by environment variables.
DEFAULT_OUTPUT_DIR = output_results_from_ini

# Path for the application log file. Overridden by environment variables.
LOG_FILE_PATH = app_logs_from_ini.log

[Models]
# Name of the model for classification tasks. Overridden by environment variables.
CLASSIFICATION_MODEL_NAME = gpt-3.5-turbo-from-ini

# Name of the model for verification tasks. Overridden by environment variables.
VERIFICATION_MODEL_NAME = gpt-4-from-ini

# Name of the model for embedding generation. Overridden by environment variables.
EMBEDDING_MODEL_NAME = text-embedding-ada-002-from-ini

[Application]
# Maximum number of retries for API calls. Overridden by environment variables.
MAX_RETRIES_API = 4

# Backoff factor for exponential backoff in API calls. Overridden by environment variables.
BACKOFF_FACTOR_API = 0.7
